name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'

concurrency:
  group: nagramx-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Guard NagramX custom features and JNI ABI
        run: python3 Tools/scripts/check_nagramx_upstream_preservation.py
      - name: Validate Lottie JNI and legacy VoIP interfaces
        run: python3 Tools/scripts/check_android_jni_abi.py
      - name: Apply AGP 9 Media3 compatibility shim
        run: python3 Tools/scripts/prepare_telegram_media3.py
      - name: Prepare collision-free standalone CI APK identity
        run: python3 Tools/scripts/prepare_ci_parallel_install.py
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Java compilation preflight (no native build)
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          sed -i 's/signingConfig = signingConfigs.release//g' TMessagesProj/build.gradle
          NATIVE_TARGET=SKIP ./gradlew TMessagesProj:compileDebugJavaWithJavac --no-configuration-cache

      - name: Restore reusable CI Debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nagramx-pr-debug-keystore-v1
      - name: Debug Build
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export DEBUG_BUILD=true
          sed -i 's/signingConfig = signingConfigs.release//g' TMessagesProj/build.gradle
          ./gradlew TMessagesProj:assembleDebug

          APK_FILE=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK_FILE"
          APK_METADATA=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_FILE" | grep '^package:')
          APK_PACKAGE=$(printf '%s\n' "$APK_METADATA" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          APK_VERSION_CODE=$(printf '%s\n' "$APK_METADATA" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          APK_VERSION_NAME=$(printf '%s\n' "$APK_METADATA" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          EXPECTED_VERSION_CODE=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)
          EXPECTED_VERSION_NAME=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          test "$APK_PACKAGE" = "nu.gpu.nagram.moyangtest"
          test "$APK_VERSION_CODE" = "$EXPECTED_VERSION_CODE"
          case "$APK_VERSION_NAME" in "$EXPECTED_VERSION_NAME"|"$EXPECTED_VERSION_NAME"-*) ;; *) echo "APK version name differs from Gradle property"; exit 1 ;; esac
          APK_DIR=$(dirname "$APK_FILE")
          printf 'package=%s\nversionCode=%s\nversionName=%s\n' "$APK_PACKAGE" "$APK_VERSION_CODE" "$APK_VERSION_NAME" | tee "$APK_DIR/apk-identity.txt"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK_FILE" \
            | tee "$(dirname "$APK_FILE")/apk-signing-certificate.txt"
          APK_NAME=$(basename "$APK_FILE")
          test "$APK_NAME" != "${APK_NAME#NagramX-}"
          mv "$APK_FILE" "$APK_DIR/NagramX-Standalone-${APK_NAME#NagramX-}"
          echo "APK=$APK_DIR" >> "$GITHUB_ENV"
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NagramX-Standalone-ARM64
          path: ${{ env.APK }}
