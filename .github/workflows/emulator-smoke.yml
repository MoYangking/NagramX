name: NagramX Android emulator startup smoke test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nagramx-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Android 15 x86_64 app launch
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NATIVE_TARGET: x86_64
    steps:
      - name: Checkout (including native dependencies)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Guard NagramX custom features and JNI ABI
        run: python3 Tools/scripts/check_nagramx_upstream_preservation.py
      - name: Validate Lottie JNI and legacy VoIP interfaces
        run: python3 Tools/scripts/check_android_jni_abi.py
      - name: Apply AGP 9 Media3 compatibility shim
        run: python3 Tools/scripts/prepare_telegram_media3.py
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0'
      - name: Configure Gradle and unsigned release config
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          sed -i 's/signingConfig = signingConfigs.release//g' TMessagesProj/build.gradle
      - name: Restore reusable CI Debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nagramx-emulator-debug-keystore-v1
      - name: Build native x86_64 Debug APK for emulator
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_BUILD: 'true'
        run: ./gradlew TMessagesProj:assembleDebug --no-configuration-cache
      - name: Enable Linux KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo '::warning::KVM unavailable; emulator may run slowly'
          fi
      - name: Install APK and verify application startup on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6144M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash Tools/scripts/emulator_smoke_test.sh
      - name: Upload screenshot, UI dump, logcat and crash details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-startup-diagnostics
          path: emulator-diagnostics/
          retention-days: 14
          if-no-files-found: warn
